name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      # trusted publishing: PyPI accepts the identity of this workflow, no token is stored
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -p "test*.py" -t .
      - run: uv build
      - run: uv publish --trusted-publishing always
