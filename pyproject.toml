[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "apiscout"
version = "3.0.0"
description = "A library for Windows API usage recovery and similarity assessment with focus on memory dumps."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Plohmann", email = "daniel.plohmann@mailbox.org" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
update = ["requests"]

[project.scripts]
apiscout = "apiscout.cli:main"

[project.urls]
Repository = "https://github.com/danielplohmann/apiscout"
Changelog = "https://github.com/danielplohmann/apiscout/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5", "ty==0.0.104", "requests"]
# what publish-release.yml builds and checks the distribution with
release = ["build==1.6.1", "twine==7.0.0"]

[tool.setuptools.packages.find]
include = ["apiscout"]

[tool.setuptools.package-data]
apiscout = ["data/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["apiscout/db_builder/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apiscout"]

[tool.pytest]
testpaths = ["tests"]
# collect what unittest collects: the TestCase classes of the test*.py files
python_files = ["test*.py"]
python_classes = []
python_functions = []
# the repository root has an __init__.py too (the Binary Ninja entry point), so in a checkout named apiscout the test
# modules are named apiscout.tests.* and that __init__.py would be imported as apiscout: import the package first
addopts = ["-ra", "--import-mode=importlib", "-p", "apiscout"]
# the tests import their helpers from each other as tests.*
pythonpath = ["."]
strict = true

[tool.ty.src]
# .github: release_guard.py runs on the Python 3.11 of publish-release.yml and reads tomllib, which 3.10 lacks
exclude = ["apiscout/db_builder", ".github"]

[tool.ty.analysis]
allowed-unresolved-imports = ["idaapi", "idc", "idautils", "ida_*", "binaryninja", "binaryninja.*", "ghidra.**", "java.**", "jpype"]
